services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chekmate
      POSTGRES_PASSWORD: chekmate
      POSTGRES_DB: chekmate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chekmate"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://chekmate:chekmate@db:5432/chekmate?sslmode=disable
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      RECEIPT_API_TOKEN: ${RECEIPT_API_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
